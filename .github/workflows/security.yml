# Contrôles de sécurité communs à tous les plugins GLPI (parime/glpi-plugin-security) : règles
# Semgrep, onglets sans droit, droits attribuables, traductions, archive, restes après désinstallation,
# secrets (Gitleaks), dépendances (Trivy, Dependency Review), CodeQL, mise à jour depuis la version
# publiée, tests d'intégration en français et parcours de toutes les pages (GLPI 11 et 12).
name: Sécurité commune

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: parime/glpi-plugin-security/.github/workflows/plugin-security.yml@v1.10.2
    with:
      plugin-key: dockerinventory
      seed-command: php plugins/dockerinventory/tests/security/setup.php
      # Charte commune bloquante : licence, en-têtes, documentation et langues conformes (#43).
      charter-mode: error
      # Matrice d'accès écrite en PHPUnit (#43) : la couverture des pages reste bloquante.
      access-matrix-file: tests/Integration/AccessControlTest.php
      # Contrôle d'ergonomie (réglages, menus, en-têtes) et parcours de toutes les pages (avec le
      # jeu de données de seed-command) en avertissement, le temps de l'issue de navigation #118 ;
      # la PR qui la ferme retire ces deux lignes.
      navigation-mode: warning
      pages-mode: warning
