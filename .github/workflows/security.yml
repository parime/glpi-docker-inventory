# Contrôles de sécurité communs à tous les plugins GLPI (parime/glpi-plugin-security) : règles
# Semgrep, onglets sans droit, droits attribuables, traductions, archive, restes après désinstallation,
# secrets (Gitleaks), dépendances (Trivy, Dependency Review), CodeQL, mise à jour depuis la version
# publiée, tests d'intégration en français et parcours de toutes les pages (GLPI 11 et 12).
name: Sécurité commune

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau commit sur une pull request annule l'exécution précédente de cette PR ; push sur main
# et lancement manuel : un groupe par exécution (run_id), jamais annulés.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: parime/glpi-plugin-security/.github/workflows/plugin-security.yml@v1.12.2
    with:
      plugin-key: dockerinventory
      # Contrôles lourds (vrai GLPI : onglets et notifications, intégration en français, mise à
      # jour, parcours des pages) seulement si la PR touche autre chose que la documentation ; tout
      # tourne sur les push (main).
      heavy-paths: '* !docs/* !*.md !*.png !*.jpg !*.jpeg !*.gif !*.svg !*.webp'
      seed-command: php plugins/dockerinventory/tests/security/setup.php
      # Charte commune bloquante : licence, en-têtes, documentation et langues conformes (#43).
      charter-mode: error
      # Matrice d'accès écrite en PHPUnit (#43) : la couverture des pages reste bloquante.
      access-matrix-file: tests/Integration/AccessControlTest.php
      # Contrôle d'ergonomie (réglages, menus, en-têtes) et parcours de toutes les pages (avec le
      # jeu de données de seed-command) bloquants depuis l'issue de navigation #118.
