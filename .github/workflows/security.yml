# Contrôles de sécurité communs à tous les plugins GLPI (parime/glpi-plugin-security) : règles
# Semgrep, onglets sans droit, droits attribuables, traductions, archive, restes après désinstallation.
name: Sécurité commune

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: parime/glpi-plugin-security/.github/workflows/plugin-security.yml@v1.8.1
    with:
      plugin-key: dockerinventory
      seed-command: php plugins/dockerinventory/tests/security/setup.php
      # Charte commune bloquante : licence, en-têtes, documentation et langues conformes (#43).
      charter-mode: error
      # Matrice d'accès écrite en PHPUnit (#43) : la couverture des pages reste bloquante.
      access-matrix-file: tests/Integration/AccessControlTest.php
