<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Docker Inventory for GLPI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22336a"/>
      <stop offset="1" stop-color="#141f45"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ef0"/>
      <stop offset="1" stop-color="#2d63c8"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb0ff"/>
      <stop offset="1" stop-color="#4a82e3"/>
    </linearGradient>
    <g id="crate">
      <rect x="0" y="0" width="132" height="84" rx="10" fill="url(#box)"/>
      <rect x="0" y="0" width="132" height="14" rx="7" fill="#9cc2ff" opacity=".55"/>
      <g stroke="#1b3f8f" stroke-width="6" stroke-linecap="round" opacity=".55">
        <line x1="26" y1="24" x2="26" y2="72"/>
        <line x1="50" y1="24" x2="50" y2="72"/>
        <line x1="74" y1="24" x2="74" y2="72"/>
        <line x1="98" y1="24" x2="98" y2="72"/>
      </g>
    </g>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#3a64c4" stroke-width="10" opacity=".55"/>

  <!-- Pile de conteneurs -->
  <use href="#crate" x="92" y="278"/>
  <use href="#crate" x="236" y="278"/>
  <use href="#crate" x="164" y="182"/>
  <g transform="translate(164 182)">
    <rect x="0" y="0" width="132" height="84" rx="10" fill="url(#box2)"/>
    <g stroke="#2457b8" stroke-width="6" stroke-linecap="round" opacity=".6">
      <line x1="26" y1="22" x2="26" y2="72"/>
      <line x1="50" y1="22" x2="50" y2="72"/>
      <line x1="74" y1="22" x2="74" y2="72"/>
      <line x1="98" y1="22" x2="98" y2="72"/>
    </g>
  </g>

  <!-- Fiche d'inventaire -->
  <g transform="translate(84 92)">
    <rect x="0" y="0" width="150" height="74" rx="12" fill="#f3f6fc"/>
    <circle cx="24" cy="24" r="9" fill="#2fb36b"/>
    <rect x="42" y="18" width="88" height="12" rx="6" fill="#b8c4dc"/>
    <circle cx="24" cy="51" r="9" fill="#2fb36b"/>
    <rect x="42" y="45" width="64" height="12" rx="6" fill="#b8c4dc"/>
  </g>

  <!-- Bouclier -->
  <g transform="translate(318 300)">
    <path d="M58 0 L116 20 V66 C116 106 90 130 58 144 C26 130 0 106 0 66 V20 Z" fill="#ffffff"/>
    <path d="M58 14 L102 30 V66 C102 98 82 118 58 129 C34 118 14 98 14 66 V30 Z" fill="#1c2a52"/>
    <path d="M34 72 L52 90 L86 52" fill="none" stroke="#d9ad4a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
